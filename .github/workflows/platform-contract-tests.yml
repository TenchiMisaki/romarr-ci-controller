name: Platform receipt and probe contracts

# Controller contracts only; no ROMarr tests, image/EXE execution or publication.
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'controller/platform_*.py'
      - 'tests/test_platform_*.py'
      - '.github/workflows/platform-contract-tests.yml'

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts ${{ matrix.os }} Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.13'
          - os: windows-2025
            python: '3.11'
          - os: windows-2025
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout isolated controller PR merge
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
      - name: Set up exact Python minor
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Verify controller platform contracts without candidate execution
        env:
          PYTHONPATH: controller
        run: python -m unittest discover -s tests -p 'test_platform_*.py' -v
