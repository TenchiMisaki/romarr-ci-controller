name: ROMarr pytest - Manual CI pilot

# Stage 1 deliberately has NO push, pull_request, or schedule triggers.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Source to test (PR or synchronized main baseline)
        type: choice
        options: [main, pull_request]
        default: main
        required: true
      pr_number:
        description: Personal-fork PR number (used only for pull_request target)
        type: string
        default: '25'
        required: true
      expected_sha:
        description: Optional complete 40-character SHA; blank pins current head
        type: string
        default: ''
        required: false
      scope:
        description: Full offline pytest or fast repository invariants
        type: choice
        options: [full, structural]
        default: full
        required: true

permissions:
  contents: read

concurrency:
  group: romarr-pytest-${{ inputs.target }}-${{ inputs.pr_number }}-${{ inputs.expected_sha || 'resolve-current' }}
  cancel-in-progress: false

jobs:
  verify:
    name: Exact-commit native ROMarr pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout controller sources (no persisted credentials)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: controller
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Resolve and pin source on GitHub
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python controller/controller/target.py resolve

      - name: Checkout pinned public ROMarr source (read-only)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: TenchiMisaki/romarr
          ref: ${{ steps.resolve.outputs.sha }}
          path: romarr
          persist-credentials: false

      - name: Checkout ROMarr's upstream Archive.org test fixture
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: BlizzHacker/rom-hub-archive-org
          ref: 3b49c1c67ccedfc5f072c19e3dd4990fec0b0d5f # upstream v0.4.1 ref resolved to immutable SHA
          path: .archive-org-proof
          persist-credentials: false

      - name: Set up Node.js 24 for ROMarr frontend regression tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install ROMarr's official CI test prerequisites
        working-directory: romarr
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'pytest==9.2.0'
          python -m pip install 'rom-hub @ https://github.com/BlizzHacker/rom-hub/archive/02e9a1dbc7ebca5191b4a977233a4d6d0466ed4b.tar.gz'

      - name: Run exact-source pytest and collect anonymous case outcomes
        id: pytest
        env:
          INPUT_SCOPE: ${{ inputs.scope }}
          ROMARR_ARCHIVE_ORG_PLUGIN_SOURCE: ${{ github.workspace }}/.archive-org-proof
        run: python controller/controller/evidence.py run

      - name: Independently recheck the live source head and local checkout
        if: ${{ always() && steps.resolve.outcome == 'success' }}
        # Authenticated read-only metadata lookup. No token is given to the pytest step.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python controller/controller/target.py postcheck

      - name: Finalize sanitized evidence and checksum manifest
        if: ${{ always() && steps.resolve.outcome == 'success' }}
        env:
          INPUT_SCOPE: ${{ inputs.scope }}
        run: python controller/controller/evidence.py finalize

      - name: Upload sanitized evidence (never raw JUnit or test logs)
        id: upload
        if: ${{ always() && steps.resolve.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: romarr-pytest-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/romarr-ci-public/
          if-no-files-found: error
          retention-days: 14

      - name: Final PASS or FAIL gate (no green result on evidence failure)
        if: ${{ always() && steps.resolve.outcome == 'success' }}
        env:
          ARTIFACT_STATUS: ${{ steps.upload.outcome }}
        run: python controller/controller/evidence.py gate
