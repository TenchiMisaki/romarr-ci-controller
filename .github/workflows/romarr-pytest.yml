name: ROMarr pytest - Manual CI pilot

# Stage 1 deliberately has NO push, pull_request, or schedule triggers.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Source to test (PR or synchronized main baseline)
        type: choice
        options: [main, pull_request]
        default: main
        required: true
      pr_number:
        description: Personal-fork PR number (used only for pull_request target)
        type: string
        default: '25'
        required: true
      expected_sha:
        description: Optional complete 40-character SHA; blank pins current head
        type: string
        default: ''
        required: false
      expected_base_sha:
        description: Optional full 40-hex PR base SHA; watcher pins this for base-aware validation
        type: string
        default: ''
        required: false
      scope:
        description: Full offline pytest or fast repository invariants
        type: choice
        options: [full, structural]
        default: full
        required: true

permissions:
  contents: read

concurrency:
  group: romarr-pytest-${{ inputs.target }}-${{ inputs.pr_number }}-${{ inputs.expected_sha || 'resolve-current' }}-${{ inputs.expected_base_sha || 'resolve-base' }}
  cancel-in-progress: false

jobs:
  verify:
    name: Exact-commit native ROMarr pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout controller sources (no persisted credentials)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: controller
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Resolve and pin source on GitHub
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_EXPECTED_SHA: ${{ inputs.expected_sha }}
          INPUT_EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
        run: python controller/controller/target.py resolve

      - name: Checkout pinned public ROMarr source (read-only)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: TenchiMisaki/romarr
          ref: ${{ steps.resolve.outputs.sha }}
          path: romarr
          persist-credentials: false

      - name: Checkout ROMarr's upstream Archive.org test fixture
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: BlizzHacker/rom-hub-archive-org
          ref: 3b49c1c67ccedfc5f072c19e3dd4990fec0b0d5f # upstream v0.4.1 ref resolved to immutable SHA
          path: .archive-org-proof
          persist-credentials: false

      - name: Set up Node.js 24 for ROMarr frontend regression tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Prepare required archive tools on isolated GitHub runner
        run: |
          set -euo pipefail
          START_EPOCH="$(date +%s)"
          finish() {
            result="$?"
            END_EPOCH="$(date +%s)"
            printf '%s\n' '================ DIAGNOSTIC FINISH ================'
            printf 'Finish time: %s; elapsed seconds: %s; exit code: %s\n' "$(date '+%Y-%m-%dT%H:%M:%S%:z')" "$((END_EPOCH-START_EPOCH))" "$result"
          }
          trap finish EXIT
          printf '%s\n' '================ PREFLIGHT CHECK ================'
          printf 'Script: GitHub runner ROMarr archive prerequisites v01\n'
          printf 'Expected: TenchiMisaki/romarr-ci-controller, GitHub Actions, Ubuntu 24.04, Linux\n'
          printf 'Detected: repository=%s, actions=%s, runner_os=%s, time=%s\n' \
            "${GITHUB_REPOSITORY:-unset}" "${GITHUB_ACTIONS:-unset}" "${RUNNER_OS:-unset}" "$(date '+%Y-%m-%dT%H:%M:%S%:z')"
          if [[ "${GITHUB_REPOSITORY:-}" != 'TenchiMisaki/romarr-ci-controller' || "${GITHUB_ACTIONS:-}" != 'true' || "${RUNNER_OS:-}" != 'Linux' ]]; then
            printf '%s\n' 'FAIL: unexpected runner identity' >&2
            exit 1
          fi
          source /etc/os-release
          if [[ "$ID" != ubuntu || "$VERSION_ID" != '24.04' ]]; then
            printf 'FAIL: unsupported OS: %s %s\n' "$ID" "$VERSION_ID" >&2
            exit 1
          fi
          packages=()
          if ! command -v bsdtar >/dev/null 2>&1; then packages+=(libarchive-tools); fi
          if ! command -v 7z >/dev/null 2>&1; then packages+=(7zip); fi
          if ! command -v unar >/dev/null 2>&1 || ! command -v lsar >/dev/null 2>&1; then packages+=(unar); fi
          if (( ${#packages[@]} > 0 )); then
            command -v sudo >/dev/null 2>&1 || { printf '%s\n' 'FAIL: sudo unavailable' >&2; exit 1; }
            printf 'Missing packages: %s\n' "${packages[*]}"
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${packages[@]}"
          else
            printf '%s\n' 'All required archive commands already present; no package changes'
          fi
          for binary in bsdtar 7z unar lsar; do
            command -v "$binary" >/dev/null 2>&1 || { printf 'FAIL: %s remains unavailable\n' "$binary" >&2; exit 1; }
            printf 'TOOL PASS: %s found\n' "$binary"
          done

      - name: Install ROMarr's official CI test prerequisites
        working-directory: romarr
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'pytest==9.2.0'
          python -m pip install 'rom-hub @ https://github.com/BlizzHacker/rom-hub/archive/02e9a1dbc7ebca5191b4a977233a4d6d0466ed4b.tar.gz'

      - name: Verify ROMarr recognizes libarchive and split-RAR tooling
        working-directory: romarr
        run: |
          python - <<'PY'
          from romarr.library import bsdtar_path, rar_tool

          bsdtar = bsdtar_path()
          rar = rar_tool()
          if bsdtar is None:
              raise SystemExit('FAIL: ROMarr did not recognize libarchive bsdtar')
          if rar is None:
              raise SystemExit('FAIL: ROMarr did not recognize a split-RAR reader')
          print('ROMarr archive tool detection PASS; split-RAR reader:', rar.kind)
          PY

      - name: Run exact-source pytest and collect anonymous case outcomes
        id: pytest
        env:
          INPUT_SCOPE: ${{ inputs.scope }}
          ROMARR_ARCHIVE_ORG_PLUGIN_SOURCE: ${{ github.workspace }}/.archive-org-proof
        run: python controller/controller/evidence.py run

      - name: Independently recheck the live source head and local checkout
        if: ${{ always() && steps.resolve.outcome == 'success' }}
        # Authenticated read-only metadata lookup. No token is given to the pytest step.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python controller/controller/target.py postcheck

      - name: Finalize sanitized evidence and checksum manifest
        if: ${{ always() && steps.resolve.outcome == 'success' }}
        env:
          INPUT_SCOPE: ${{ inputs.scope }}
        run: python controller/controller/evidence.py finalize

      - name: Upload sanitized evidence (never raw JUnit or test logs)
        id: upload
        if: ${{ always() && steps.resolve.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: romarr-pytest-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/romarr-ci-public/
          if-no-files-found: error
          retention-days: 14

      - name: Final PASS or FAIL gate (no green result on evidence failure)
        if: ${{ always() && steps.resolve.outcome == 'success' }}
        env:
          ARTIFACT_STATUS: ${{ steps.upload.outcome }}
        run: python controller/controller/evidence.py gate
