name: ROMarr Stage 6 - Manual advisory bytes verified (v28 CANDIDATE)

# PRIVATE CANDIDATE, NOT INSTALLED. Manual-only; no source PR selection, publication, dispatch or schedule.
# Artifact transport demonstration only. NOT an accepted PR receipt.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: romarr-stage6-source-pilot-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  isolated_source:
    name: Run one real ROMarr test file in offline container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      cases: ${{ steps.source.outputs.cases }}
      pytest_exit: ${{ steps.source.outputs.pytest_exit }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Fetch immutable public ROMarr source and test without credentials
        id: source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: 3c9896d2406d331c4f25c8a9f661c711ffe51745
        run: |
          set -euo pipefail
          umask 077
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'BLOCKED: invalid fixed source identity' >&2
            exit 1
          fi
          if [[ -z "${RUNNER_TEMP:-}" || ! -d "$RUNNER_TEMP" ]]; then
            echo 'BLOCKED: runner temporary directory missing' >&2
            exit 1
          fi
          source_dir="$(mktemp -d "${RUNNER_TEMP}/stage6-source.XXXXXXXX")"
          result_dir="$(mktemp -d "${RUNNER_TEMP}/stage6-result.XXXXXXXX")"
          build_dir="$(mktemp -d "${RUNNER_TEMP}/stage6-image.XXXXXXXX")"
          image="romarr-stage6-pilot-${GITHUB_RUN_ID}"
          cleanup() {
            docker image rm "$image" >/dev/null 2>&1 || true
            rm -rf -- "$source_dir" "$result_dir" "$build_dir"
          }
          trap cleanup EXIT
          git init -q "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/TenchiMisaki/romarr.git
          timeout 75s git -C "$source_dir" -c protocol.version=2 \
            fetch --quiet --no-tags --depth=1 origin "$EXPECTED_SOURCE_SHA"
          git -C "$source_dir" checkout -q --detach FETCH_HEAD
          actual_sha="$(git -C "$source_dir" rev-parse --verify HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo 'BLOCKED: checkout source SHA mismatch' >&2
            exit 1
          fi
          if ! source_status="$(git -C "$source_dir" status --porcelain --untracked-files=all)"; then
            echo 'BLOCKED: source checkout status could not be verified' >&2
            exit 1
          fi
          if [[ -n "$source_status" ]]; then
            echo 'BLOCKED: source checkout is not clean' >&2
            exit 1
          fi
          if [[ ! -f "$source_dir/tests/test_wired.py" || ! -f "$source_dir/pytest.ini" ]]; then
            echo 'BLOCKED: required source test files absent' >&2
            exit 1
          fi
          cat > "$build_dir/Dockerfile" <<'DOCKERFILE'
          FROM --platform=linux/amd64 python:3.13.18-slim@sha256:aaf08c5490d52cd92bc27142a5215b1e47355a5eaf9adfad2a0fbc022d0b5490
          RUN python -m pip install --no-cache-dir 'pytest==9.2.0'
          WORKDIR /src
          DOCKERFILE
          timeout 240s docker build --quiet --pull --platform linux/amd64 --tag "$image" "$build_dir" >/dev/null
          set +e
          timeout 300s docker run --rm --platform linux/amd64 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 128 --memory 1024m --cpus 2 \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=${source_dir},target=/src,readonly" \
            --mount "type=bind,source=${result_dir},target=/out" \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            "$image" /bin/sh -c \
            'umask 077; python -m pytest -q -p no:cacheprovider --junitxml=/out/private.xml tests/test_wired.py > /out/private.stdout 2> /out/private.stderr'
          test_exit=$?
          set -e
          if [[ "$test_exit" != 0 ]]; then
            echo 'BLOCKED: isolated focused ROMarr source tests did not pass' >&2
            exit 1
          fi
          HANDOFF_DIR="${RUNNER_TEMP}/stage6-v26-advisory"
          mkdir -m 700 -- "$HANDOFF_DIR"
          RESULT_DIR="$result_dir" HANDOFF_DIR="$HANDOFF_DIR" RAW_EXIT="$test_exit" \
          EXPECTED_SOURCE_SHA="$EXPECTED_SOURCE_SHA" python3 - <<'PYTHON'
          import os
          import hashlib
          import json
          from pathlib import Path
          import re
          import stat
          import xml.etree.ElementTree as ET

          if os.environ.get('RAW_EXIT') != '0':
              raise SystemExit('BLOCKED: raw test exit was nonzero')
          root = Path(os.environ['RESULT_DIR'])
          if root.is_symlink() or not root.is_dir():
              raise SystemExit('BLOCKED: result directory invalid')
          source = root / 'private.xml'
          if source.is_symlink() or not source.is_file():
              raise SystemExit('BLOCKED: private result file missing')
          info = source.lstat()
          if (not stat.S_ISREG(info.st_mode) or info.st_nlink != 1 or
                  info.st_mode & 0o077 or not 0 < info.st_size <= 500_000):
              raise SystemExit('BLOCKED: private result file unsafe')
          raw = source.read_bytes()
          if re.search(rb'<!\s*(?:DOCTYPE|ENTITY)\b', raw, flags=re.I):
              raise SystemExit('BLOCKED: XML prohibited construct')
          try:
              doc = ET.fromstring(raw)
          except ET.ParseError:
              raise SystemExit('BLOCKED: malformed private XML') from None
          suites = ([doc] if doc.tag == 'testsuite' else
                    list(doc) if doc.tag == 'testsuites' else [])
          if not suites or any(s.tag != 'testsuite' for s in suites):
              raise SystemExit('BLOCKED: unexpected test suite shape')
          total = 0
          for suite in suites:
              cases = [x for x in suite if x.tag == 'testcase']
              if any(x.tag not in ('testcase', 'properties', 'system-out', 'system-err') for x in suite):
                  raise SystemExit('BLOCKED: unexpected JUnit child')
              fields = ('tests', 'failures', 'errors', 'skipped')
              try:
                  declared = {name: int(suite.attrib[name]) for name in fields}
              except (KeyError, ValueError):
                  raise SystemExit('BLOCKED: missing JUnit totals') from None
              if not 0 < declared['tests'] <= 256 or any(v < 0 for v in declared.values()):
                  raise SystemExit('BLOCKED: unbounded JUnit totals')
              if declared != {'tests': len(cases), 'failures': 0, 'errors': 0, 'skipped': 0}:
                  raise SystemExit('BLOCKED: JUnit totals mismatch or non-passing case')
              if any(x.tag in ('failure', 'error', 'skipped') for case in cases for x in case):
                  raise SystemExit('BLOCKED: JUnit contained non-passing outcomes')
              total += len(cases)
          if not 0 < total <= 256:
              raise SystemExit('BLOCKED: JUnit case budget exceeded')
          source_sha = os.environ['EXPECTED_SOURCE_SHA']
          if not re.fullmatch('[a-f0-9]{40}', source_sha):
              raise SystemExit('BLOCKED: invalid source output SHA')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='ascii') as out:
              out.write(f'source_sha={source_sha}\n')
              out.write(f'cases={"P" * total}\n')
              out.write('pytest_exit=0\n')
          # Trusted host-side sanitizer: public artifact has two allowlisted files only.
          # The test source runs in the offline container and cannot access this directory.
          handoff = Path(os.environ['HANDOFF_DIR'])
          if handoff.is_symlink() or not handoff.is_dir():
              raise SystemExit('BLOCKED: invalid handoff directory')
          run_id = os.environ.get('GITHUB_RUN_ID', '')
          if not run_id.isdecimal() or int(run_id) < 1:
              raise SystemExit('BLOCKED: run identity missing')
          record = {
              'schema': 'romarr-stage6-v26-anonymous-advisory-v1',
              'run_id': int(run_id), 'source_sha': source_sha,
              'passing_cases': total, 'pytest_exit': 0,
              'test_accepted': False, 'publication_authorized': False,
              'unattended_dispatch_enabled': False,
          }
          def canonical(obj):
              return (json.dumps(obj, sort_keys=True, separators=(',', ':'),
                                 allow_nan=False) + '\n').encode('ascii')
          advisory = canonical(record)
          manifest = canonical({'schema': record['schema'], 'files': {
              'advisory.json': {'sha256': hashlib.sha256(advisory).hexdigest(),
                                'bytes': len(advisory)}}})
          for name, payload in [('advisory.json', advisory), ('manifest.json', manifest)]:
              path = handoff / name
              with path.open('xb') as fh:
                  fh.write(payload)
              path.chmod(0o600)
          print(f'SOURCE_PILOT: pinned source and {total} anonymous passing tests observed')
          print('TEST_ACCEPTED: false')
          PYTHON

      - name: Upload only sanitized advisory and manifest
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: romarr-stage6-v26-advisory
          path: |
            ${{ runner.temp }}/stage6-v26-advisory/advisory.json
            ${{ runner.temp }}/stage6-v26-advisory/manifest.json
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
          compression-level: 0

  isolated_reviewer:
    name: Separate runner validates advisory source outcome
    needs: [isolated_source]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout fixed workflow controller revision without saved credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            controller/stage6_hosted_api_v27.py
            controller/stage6_manual_readback_v28.py
            controller/stage6_artifact_http.py
            controller/stage6_github_artifact_envelope.py
            controller/stage6_artifact_readback.py
            controller/stage6_hosted_advisory_bundle.py
            controller/stage6_hosted_provenance.py
          sparse-checkout-cone-mode: false

      - name: Independently check GitHub run, source job and artifact metadata
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_CONTROLLER_SHA: ${{ github.sha }}
          EXPECTED_ARTIFACT_ID: ${{ needs.isolated_source.outputs.artifact_id }}
          UPLOADED_ARTIFACT_DIGEST: ${{ needs.isolated_source.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          python3 controller/stage6_hosted_api_v27.py

      - name: Download and hash-check raw GitHub artifact in isolated verifier
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_CONTROLLER_SHA: ${{ github.sha }}
          EXPECTED_ARTIFACT_ID: ${{ needs.isolated_source.outputs.artifact_id }}
          UPLOADED_ARTIFACT_DIGEST: ${{ needs.isolated_source.outputs.artifact_digest }}
          UNTRUSTED_SOURCE_SHA: ${{ needs.isolated_source.outputs.source_sha }}
          UNTRUSTED_CASES: ${{ needs.isolated_source.outputs.cases }}
          UNTRUSTED_EXIT: ${{ needs.isolated_source.outputs.pytest_exit }}
          SOURCE_JOB_RESULT: ${{ needs.isolated_source.result }}
          APPROVED_STORAGE_HOST: ${{ vars.ROMARR_STAGE6_STORAGE_HOST }}
          ADDITIONAL_APPROVED_STORAGE_HOST: ${{ vars.ROMARR_STAGE6_STORAGE_HOST_SECONDARY }}
        run: |
          set -euo pipefail
          python3 controller/stage6_manual_readback_v28.py
