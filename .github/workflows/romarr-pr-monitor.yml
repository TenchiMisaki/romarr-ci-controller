name: ROMarr PR and CodeRabbit read-only monitor

# Offline Stage 5 candidate only. Hosted Stage 4A was accepted on Nov 15.
# Existing metadata-only monitor is retained. One already-claimed exact receipt
# may be independently verified, with no GitHub writes or pytest dispatch.
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: romarr-pr-monitor-readonly
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout controller default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Read-only eligibility and historical claim audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python controller/watch.py audit
      - name: Read-only exact-head pytest and CodeRabbit metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python controller/status.py audit > "$RUNNER_TEMP/romarr-status.json"
      - name: Inspect one existing exact-source receipt (GET-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python controller/scheduled_receipt.py audit "$RUNNER_TEMP/romarr-status.json" > "$RUNNER_TEMP/romarr-receipt.json"
      - name: Finalize sanitized summary or safe incomplete-status fallback
        if: ${{ !cancelled() }}
        run: python controller/scheduled_receipt.py finalize "$RUNNER_TEMP/romarr-status.json" "$RUNNER_TEMP/romarr-receipt.json" "$RUNNER_TEMP/romarr-monitor-summary.md"
      - name: Publish sanitized metadata and receipt summary
        if: ${{ !cancelled() }}
        run: cat "$RUNNER_TEMP/romarr-monitor-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain sanitized summary only (7 days)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, Node.js 24
        with:
          name: romarr-monitor-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/romarr-monitor-summary.md
          if-no-files-found: error
          retention-days: 7
