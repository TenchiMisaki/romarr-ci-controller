name: ROMarr receipt - manual read-only verification

# Isolated prerequisite for a future scheduled receipt monitor.
# No pytest execution, workflow dispatch, claim creation, or ROMarr source write.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open, non-draft ROMarr fork PR with an existing v2 receipt claim'
        required: true
        type: string
      head_sha:
        description: 'Exact existing 40-character ROMarr PR head commit'
        required: true
        type: string
      base_sha:
        description: 'Exact existing 40-character ROMarr PR base commit'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout controller sources (no persisted credentials)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Verify one existing exact-PR receipt (GET only)
        env:
          GH_TOKEN: ${{ github.token }}
          ROMARR_SELECTED_PR: ${{ inputs.pr_number }}
          ROMARR_SELECTED_HEAD_SHA: ${{ inputs.head_sha }}
          ROMARR_SELECTED_BASE_SHA: ${{ inputs.base_sha }}
        run: python controller/receipt_collector.py
